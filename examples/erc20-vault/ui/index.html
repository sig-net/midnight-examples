<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ERC20 vault</title>
    <script>
      // shadcn/ui gates its dark tokens on a `dark` class, so the theme is this
      // one class on <html>. Applied here, inline and in <head>, because this
      // has to happen BEFORE the first paint: a module script runs after it,
      // and the page would flash the wrong theme on every load.
      //
      // Which makes this the one thing that cannot import src/lib/theme.ts,
      // and so the one place its storage key and its light/dark decision are
      // duplicated. Keep the two in step. Everything after the first paint,
      // including switching the theme and following the OS while it is open,
      // belongs to ThemeContext and does not go here.
      (() => {
        // Keep in step with THEME_STORAGE_KEY in src/lib/theme.ts.
        const STORAGE_KEY = "erc20-vault-ui.theme";
        let stored = null;
        try {
          stored = window.localStorage.getItem(STORAGE_KEY);
        } catch {
          // Storage blocked. Fall through to the operating system.
        }
        const dark =
          stored === "dark" ||
          (stored !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
