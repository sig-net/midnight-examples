# Thin per-example caller: paths-filter + one `uses:` of the reusable
# example-test workflow. PRs/pushes run the happy-day gate spec; the full
# five-spec suite is opt-in via workflow_dispatch.

name: erc20-vault

on:
  push:
    branches: [main]
    paths:
      - "examples/erc20-vault/**"
      - "packages/**"
      - "docker-compose.yaml"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/example-test.yaml"
      - ".github/workflows/erc20-vault.yaml"
  pull_request:
    paths:
      - "examples/erc20-vault/**"
      - "packages/**"
      - "docker-compose.yaml"
      - "package.json"
      - "yarn.lock"
      - ".yarnrc.yml"
      - "tsconfig.base.json"
      - "eslint.config.js"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/example-test.yaml"
      - ".github/workflows/erc20-vault.yaml"
  workflow_dispatch:
    inputs:
      full-suite:
        description: "Run the FULL e2e suite (all five specs), not just happy-day"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: erc20-vault-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    uses: ./.github/workflows/example-test.yaml
    # The reusable workflow sees no secrets unless the caller passes them.
    # Passed by name (never `secrets: inherit`): the callee's declared
    # secrets are the full list of what it can read.
    secrets:
      SEPOLIA_FORK_RPC_URL: ${{ secrets.SEPOLIA_FORK_RPC_URL }}
    with:
      example-dir: erc20-vault
      # PR/push gate: happy-day (deposit+withdraw), the swap success path (exactOutput
      # mints tokenOut + change), and every refund branch (withdraw-failure, swap-failure,
      # supply-failure), plus the Aave lending round-trip (supply USDC -> stataUSDC ->
      # redeem). The full suite stays opt-in via workflow_dispatch.
      gate-spec: "tests/happy-day-e2e.test.ts tests/swap-e2e.test.ts tests/deposit-withdrawal-failure-refund.test.ts tests/swap-refund-e2e.test.ts tests/supply-redeem-e2e.test.ts tests/supply-refund-e2e.test.ts"
      full-suite: ${{ github.event_name == 'workflow_dispatch' && inputs.full-suite == true }}
